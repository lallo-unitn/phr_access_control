services:
  server:
    build: .
    image: phr-charm
    working_dir: /app/phr_project
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000 --noreload"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 2)"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s

  client:
    build: .
    image: phr-charm
    profiles: ["client"]
    network_mode: "service:server"
    depends_on:
      server:
        condition: service_healthy
    working_dir: /app/test_client
    command: python main.py
    volumes:
      - .:/app
    environment:
      PYTHONUNBUFFERED: "1"
    stdin_open: true
    tty: true
